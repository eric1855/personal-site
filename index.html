<!DOCTYPE html>
<html lang="en" style="height:100%">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='black'/><text x='50' y='54' text-anchor='middle' dominant-baseline='central' font-family='sans-serif' font-weight='bold' font-size='60' fill='white'>E</text></svg>" />
    <title>Eric Wang — Creative Developer</title>
    <meta name="description" content="Interactive 3D portfolio of Eric Wang. Drive around and explore projects, experiments, and more." />
    <meta property="og:title" content="Eric Wang — Creative Developer" />
    <meta property="og:description" content="Interactive 3D portfolio. Drive a car around and explore my work." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Eric Wang — Creative Developer" />
    <meta name="twitter:description" content="Interactive 3D portfolio. Drive a car around and explore my work." />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
      canvas { display: block; }

      /* ── Loading Screen ──────────────────────────────────────── */
      #loading-screen {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #000;
        transition: opacity 0.6s ease;
      }
      #loading-screen.fade-out { opacity: 0; pointer-events: none; }

      /* Name */
      .ls-name {
        margin: 0 0 6px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: clamp(2rem, 6vw, 4rem); font-weight: 700; letter-spacing: -0.03em;
        color: #fff; opacity: 0;
        animation: lsFadeUp 0.8s ease forwards 0.3s;
      }
      /* Subtitle */
      .ls-subtitle {
        margin: 0 0 48px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: clamp(0.9rem, 2vw, 1.25rem); color: rgba(255,255,255,0.5);
        opacity: 0; animation: lsFadeUp 0.6s ease forwards 1.0s;
      }

      /* Road scene container */
      .ls-road-scene {
        position: relative; width: min(80vw, 500px); height: 60px;
      }

      /* Car group — drives across */
      .ls-car {
        position: absolute; bottom: 12px; left: 0;
        width: 56px; height: 28px;
        animation: lsDrive 2.8s cubic-bezier(0.25, 0.1, 0.25, 1) forwards 0.2s;
      }
      .ls-car-body {
        position: absolute; bottom: 6px; left: 0;
        width: 56px; height: 16px; border-radius: 4px 4px 2px 2px;
        background: #5b8dee;
      }
      .ls-car-cabin {
        position: absolute; bottom: 20px; left: 14px;
        width: 26px; height: 12px; border-radius: 3px 6px 0 0;
        background: #4a7bd4;
      }
      .ls-car-wheel {
        position: absolute; bottom: 2px;
        width: 10px; height: 10px; border-radius: 50%;
        background: #222; border: 2px solid #444;
        animation: lsSpin 0.4s linear infinite;
      }
      .ls-car-wheel--rear { left: 6px; }
      .ls-car-wheel--front { right: 6px; }
      .ls-headlight {
        position: absolute; bottom: 10px; right: -2px;
        width: 4px; height: 4px; border-radius: 50%;
        background: #ffe68a; box-shadow: 0 0 6px 2px rgba(255,230,138,0.5);
      }

      /* Dust particles — nested inside .ls-car so they follow its translateX */
      .ls-dust {
        position: absolute; bottom: -2px; left: -4px;
        width: 6px; height: 6px; border-radius: 50%;
        background: rgba(255,255,255,0.25);
        opacity: 0;
        animation: lsDustTrail 0.8s ease-out infinite;
      }
      .ls-dust:nth-of-type(2) { animation-delay: 0.5s; width: 5px; height: 5px; bottom: 0px; }
      .ls-dust:nth-of-type(3) { animation-delay: 1.0s; width: 4px; height: 4px; bottom: -4px; }
      .ls-dust:nth-of-type(4) { animation-delay: 1.5s; width: 6px; height: 6px; bottom: 2px; }
      .ls-dust:nth-of-type(5) { animation-delay: 2.0s; width: 5px; height: 5px; bottom: -3px; }

      /* Road line */
      .ls-road {
        position: absolute; bottom: 8px; left: 0; right: 0;
        height: 2px; background: rgba(255,255,255,0.1);
      }
      .ls-road::after {
        content: ''; position: absolute; left: 0; top: 0; bottom: 0;
        width: 0; background: #5b8dee; border-radius: 1px;
        box-shadow: 0 0 8px rgba(91,141,238,0.4);
        animation: lsRoadFill 2.8s cubic-bezier(0.25, 0.1, 0.25, 1) forwards 0.2s;
      }

      /* Controls hint */
      .ls-controls {
        margin: 32px 0 0; font-family: monospace; font-size: 0.8rem;
        color: rgba(255,255,255,0.3); letter-spacing: 0.08em;
        opacity: 0; animation: lsFadeIn 0.5s ease forwards 1.8s;
      }
      .ls-controls kbd {
        display: inline-block; padding: 1px 6px; margin: 0 1px;
        border-radius: 4px; border: 1px solid rgba(255,255,255,0.25);
        background: rgba(255,255,255,0.08); font-family: monospace; font-size: 11px;
        color: rgba(255,255,255,0.5);
      }

      /* Keyframes */
      @keyframes lsFadeUp {
        from { opacity: 0; transform: translateY(10px); filter: blur(4px); }
        to   { opacity: 1; transform: translateY(0);    filter: blur(0); }
      }
      @keyframes lsFadeIn {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @keyframes lsDrive {
        from { transform: translateX(0); }
        to   { transform: translateX(calc(min(80vw, 500px) - 56px)); }
      }
      @keyframes lsSpin {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }
      @keyframes lsDustTrail {
        0%   { opacity: 0.35; transform: translateX(0) scale(1); }
        100% { opacity: 0;    transform: translateX(-24px) scale(0.3); }
      }
      @keyframes lsRoadFill {
        from { width: 0; }
        to   { width: 100%; }
      }
      @media (prefers-reduced-motion: reduce) {
        .ls-name, .ls-subtitle, .ls-controls { animation: none; opacity: 1; }
        .ls-car { animation: none; transform: translateX(calc(min(80vw, 500px) / 2 - 28px)); }
        .ls-car-wheel { animation: none; }
        .ls-dust { animation: none; display: none; }
        .ls-road::after { animation: none; width: 100%; }
      }
    </style>
  </head>
  <body>
    <!-- Loading Screen -->
    <div id="loading-screen">
      <h1 class="ls-name">Eric Wang</h1>
      <p class="ls-subtitle">Creative Developer</p>
      <div class="ls-road-scene">
        <div class="ls-car">
          <div class="ls-car-body"></div>
          <div class="ls-car-cabin"></div>
          <div class="ls-car-wheel ls-car-wheel--rear"></div>
          <div class="ls-car-wheel ls-car-wheel--front"></div>
          <div class="ls-headlight"></div>
          <div class="ls-dust"></div>
          <div class="ls-dust"></div>
          <div class="ls-dust"></div>
          <div class="ls-dust"></div>
          <div class="ls-dust"></div>
        </div>
        <div class="ls-road"></div>
      </div>
      <p class="ls-controls">
        <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> to drive
        &middot; <kbd>E</kbd> interact
      </p>
    </div>

    <div id="hud"></div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
